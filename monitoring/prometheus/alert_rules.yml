groups:
  - name: fitness_alerts
    rules:

      - alert: NodeDown
        expr: up == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Service instance is down"
          description: "{{ $labels.instance }} is unavailable."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.99,
            sum by (le, job, instance) (
              rate(http_request_duration_seconds_bucket[1m])
            )
          ) > 0.5
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "High request latency"
          description: "P99 latency on {{ $labels.instance }} exceeds 500 ms."

      - alert: HighEventPropagationLag
        expr: event_propagation_lag_seconds > 5
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "High event propagation lag"
          description: "Event propagation lag exceeds 5 seconds."