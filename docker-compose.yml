services:

  user-profile-service:
    build:
      context: ./UserProfileService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__ProfilesDb: "Host=postgres;Port=5432;Database=fitness;Username=fitness_admin;Password=${POSTGRES_PASSWORD:-fitness_local_dev}"
    networks:
      - fitness-network
    restart: unless-stopped

  load-calculation-service:
    build:
      context: ./LoadCalculationService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Services__UserProfileService: "http://user-profile-service:8080"
      ConnectionStrings__LoadDb: "Host=postgres;Port=5432;Database=fitness;Username=fitness_admin;Password=${POSTGRES_PASSWORD:-fitness_local_dev}"
    depends_on:
      - user-profile-service
    networks:
      fitness-network:
        aliases:
          - load-instance-1
    restart: unless-stopped

  load-calculation-service-2:
    build:
      context: ./LoadCalculationService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Services__UserProfileService: "http://user-profile-service:8080"
      ConnectionStrings__LoadDb: "Host=postgres;Port=5432;Database=fitness;Username=fitness_admin;Password=${POSTGRES_PASSWORD:-fitness_local_dev}"
    depends_on:
      - user-profile-service
    networks:
      fitness-network:
        aliases:
          - load-instance-2
    restart: unless-stopped

  load-calculation-service-3:
    build:
      context: ./LoadCalculationService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Services__UserProfileService: "http://user-profile-service:8080"
      ConnectionStrings__LoadDb: "Host=postgres;Port=5432;Database=fitness;Username=fitness_admin;Password=${POSTGRES_PASSWORD:-fitness_local_dev}"
    depends_on:
      - user-profile-service
    networks:
      fitness-network:
        aliases:
          - load-instance-3
    restart: unless-stopped

  training-service:
    build:
      context: ./TrainingService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      RabbitMQ__HostName: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: "guest"
      RabbitMQ__Password: "guest"
      ConnectionStrings__TrainingDb: "Host=postgres;Port=5432;Database=fitness;Username=fitness_admin;Password=${POSTGRES_PASSWORD:-fitness_local_dev}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - fitness-network
    restart: unless-stopped

  statistics-service:
    build:
      context: ./StatisticsService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      RabbitMQ__HostName: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: "guest"
      RabbitMQ__Password: "guest"
      ConnectionStrings__StatisticsDb: "Host=postgres;Port=5432;Database=fitness;Username=fitness_admin;Password=${POSTGRES_PASSWORD:-fitness_local_dev}"
      SAGA_DEMO_FAIL: "false"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - fitness-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/fitness/.well-known/openid-configuration"
    depends_on:
      - user-profile-service
      - load-calculation-service
      - load-calculation-service-2
      - load-calculation-service-3
      - training-service
      - statistics-service
    networks:
      - fitness-network
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fitness
      POSTGRES_USER: fitness_admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-fitness_local_dev}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01-create-schemas.sql:/docker-entrypoint-initdb.d/01-create-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fitness_admin -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - fitness-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - fitness-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-}"
      KC_HOSTNAME: "http://localhost:8081"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - fitness-network

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - fitness-network
    restart: unless-stopped
  
  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - fitness-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.5.0
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - fitness-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/tmp/loki
    networks:
      - fitness-network
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.0
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - fitness-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - fitness-network
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.49.6
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Europe/Kyiv
      GENERIC_TIMEZONE: Europe/Kyiv
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - fitness-network
    restart: unless-stopped

networks:
  fitness-network:
    driver: bridge

volumes:
  rabbitmq_data:
  postgres_data:
  keycloak_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
  alertmanager_data:
  n8n_data: