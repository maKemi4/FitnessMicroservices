services:

  user-profile-service:
    build:
      context: ./UserProfileService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__ProfilesDb: "Host=postgres;Port=5432;Database=fitness;Username=fitness_admin;Password=${POSTGRES_PASSWORD:-fitness_local_dev}"
    networks:
      - fitness-network
    restart: unless-stopped

  load-calculation-service:
    build:
      context: ./LoadCalculationService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Services__UserProfileService: "http://user-profile-service:8080"
      ConnectionStrings__LoadDb: "Host=postgres;Port=5432;Database=fitness;Username=fitness_admin;Password=${POSTGRES_PASSWORD:-fitness_local_dev}"
    depends_on:
      - user-profile-service
    networks:
      fitness-network:
        aliases:
          - load-instance-1
    restart: unless-stopped

  load-calculation-service-2:
    build:
      context: ./LoadCalculationService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Services__UserProfileService: "http://user-profile-service:8080"
      ConnectionStrings__LoadDb: "Host=postgres;Port=5432;Database=fitness;Username=fitness_admin;Password=${POSTGRES_PASSWORD:-fitness_local_dev}"
    depends_on:
      - user-profile-service
    networks:
      fitness-network:
        aliases:
          - load-instance-2
    restart: unless-stopped

  load-calculation-service-3:
    build:
      context: ./LoadCalculationService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Services__UserProfileService: "http://user-profile-service:8080"
      ConnectionStrings__LoadDb: "Host=postgres;Port=5432;Database=fitness;Username=fitness_admin;Password=${POSTGRES_PASSWORD:-fitness_local_dev}"
    depends_on:
      - user-profile-service
    networks:
      fitness-network:
        aliases:
          - load-instance-3
    restart: unless-stopped

  training-service:
    build:
      context: ./TrainingService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      RabbitMQ__HostName: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: "guest"
      RabbitMQ__Password: "guest"
      ConnectionStrings__TrainingDb: "Host=postgres;Port=5432;Database=fitness;Username=fitness_admin;Password=${POSTGRES_PASSWORD:-fitness_local_dev}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - fitness-network
    restart: unless-stopped

  statistics-service:
    build:
      context: ./StatisticsService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      RabbitMQ__HostName: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: "guest"
      RabbitMQ__Password: "guest"
      ConnectionStrings__StatisticsDb: "Host=postgres;Port=5432;Database=fitness;Username=fitness_admin;Password=${POSTGRES_PASSWORD:-fitness_local_dev}"
      SAGA_DEMO_FAIL: "false"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - fitness-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
    depends_on:
      - user-profile-service
      - load-calculation-service
      - load-calculation-service-2
      - load-calculation-service-3
      - training-service
      - statistics-service
    networks:
      - fitness-network
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fitness
      POSTGRES_USER: fitness_admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-fitness_local_dev}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01-create-schemas.sql:/docker-entrypoint-initdb.d/01-create-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fitness_admin -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - fitness-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - fitness-network
    restart: unless-stopped

networks:
  fitness-network:
    driver: bridge

volumes:
  rabbitmq_data:
  postgres_data: